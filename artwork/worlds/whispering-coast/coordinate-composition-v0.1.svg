<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800">
<title>Whispering Coast — coordinate composition v0.1</title>
<desc>Unpublished design schematic, north up. One hundred SVG units per kilometre. Canonical proposed marker positions are mapped from world coordinates; no gameplay art is implied.</desc>
<defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#46695c" stroke-opacity=".4"/></pattern><clipPath id="frame"><rect width="600" height="600"/></clipPath></defs>
<rect width="760" height="800" fill="#f4edda"/>
<text x="80" y="32" font-family="serif" font-size="22" font-weight="bold" fill="#315747">WHISPERING COAST — COMPOSITION STUDY</text>
<g transform="translate(80 60)" clip-path="url(#frame)">
<rect width="600" height="600" fill="#98c0c7"/>
<!-- West mainland, east-facing coast; southern inlet cuts inland to Driftwood Cove. -->
<path d="M0 0H480 Q520 38 490 82 Q475 110 410 120 Q290 115 255 165 Q280 205 370 190 Q440 175 435 245 Q485 250 470 300 Q445 320 505 343 Q523 366 488 400 Q460 420 400 430 Q300 445 205 460 Q155 470 180 490 Q220 520 335 510 Q395 510 375 550 Q350 580 365 600 H0Z" fill="#e8d6a6" stroke="#f3e6c6" stroke-width="10"/>
<path d="M0 0H460 Q492 40 462 72 Q440 95 395 98 Q270 94 232 159 Q235 232 367 214 Q411 202 414 251 Q455 262 446 294 Q413 335 476 352 Q495 369 465 390 Q400 414 295 425 Q190 440 159 469 Q128 511 206 532 Q260 546 333 533 Q349 557 331 600 H0Z" fill="#b4c39a"/>
<!-- Jetty attached to the eastern headland, ending at the exact marker. -->
<path d="M473 359L560 370" stroke="#806447" stroke-width="17" stroke-linecap="round"/>
<path d="M477 359L560 370" stroke="#c29b6e" stroke-width="10"/>
<!-- Coastal trail deliberately routes inland, not across the inlet. -->
<path d="M460 90 Q350 55 280 110 Q160 150 200 260 Q240 330 395 350 M200 260 Q120 350 140 450 Q130 540 320 570" fill="none" stroke="#9c8256" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 7"/>
<!-- Marker x=(easting-42000)/10; y=(57000-northing)/10 -->
<rect width="600" height="600" fill="url(#grid)"/>
<g font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#54452b">
<circle cx="460" cy="90" r="15" fill="#fff0c9" stroke="#886a39" stroke-width="2"/><text x="460" y="95">1</text>
<circle cx="180" cy="480" r="15" fill="#fff0c9" stroke="#886a39" stroke-width="2"/><text x="180" y="485">2</text>
<circle cx="320" cy="570" r="15" fill="#fff0c9" stroke="#886a39" stroke-width="2"/><text x="320" y="575">3</text>
<circle cx="560" cy="370" r="15" fill="#fff0c9" stroke="#886a39" stroke-width="2"/><text x="560" y="375">4</text>
<circle cx="250" cy="170" r="15" fill="#fff0c9" stroke="#886a39" stroke-width="2"/><text x="250" y="175">5</text>
<circle cx="410" cy="250" r="15" fill="#fff0c9" stroke="#886a39" stroke-width="2"/><text x="410" y="255">6</text>
</g></g>
<rect x="80" y="60" width="600" height="600" fill="none" stroke="#847650" stroke-width="2"/>
<g font-family="sans-serif" font-size="15" fill="#315747"><text x="85" y="680">42</text><text x="70" y="655" text-anchor="end">51</text><text x="185" y="680">43</text><text x="70" y="555" text-anchor="end">52</text><text x="285" y="680">44</text><text x="70" y="455" text-anchor="end">53</text><text x="385" y="680">45</text><text x="70" y="355" text-anchor="end">54</text><text x="485" y="680">46</text><text x="70" y="255" text-anchor="end">55</text><text x="585" y="680">47</text><text x="70" y="155" text-anchor="end">56</text><text x="680" y="50" text-anchor="end">N ↑</text></g>
<g font-family="sans-serif" font-size="15" fill="#54452b"><text x="80" y="712">1 Beacon Point · 4656</text><text x="390" y="712">2 Driftwood Cove · 4352</text><text x="80" y="736">3 Shell Beach · 4551</text><text x="390" y="736">4 Old Jetty · 4753</text><text x="80" y="760">5 Gull Rock · 4455</text><text x="390" y="760">6 Tidepool Bend · 4654</text></g>
<text x="80" y="788" font-family="sans-serif" font-size="12" fill="#766d59">DESIGN ONLY • Not runtime art • All 36 squares remain valid grid objectives</text>
</svg>