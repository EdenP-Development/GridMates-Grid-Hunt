name: Grid Hunt Vision Lab QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/gh01-android-qa.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'scripts/**'
      - 'distribution/qa-update-baseline.json'
      - '.github/workflows/gh01-android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridhunt-stable-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    name: JVM tests, instrumentation-test compile and stable QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu already carries Android SDK; avoid setup-android@v3
      # attempting to install the retired 'tools' package on 2026 runners.
      - name: Verify or install required Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Test update-policy parsing and rejection cases
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Compile, execute core tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --stacktrace --console=plain
      - name: Capture exact source, signer and APK checksum
        run: |
          mkdir -p vision-qa-output
          cp app/build/outputs/apk/debug/app-debug.apk vision-qa-output/GridHunt-VisionLab-QA.apk
          cd vision-qa-output
          sha256sum GridHunt-VisionLab-QA.apk > APK_SHA256.txt
          git -C .. rev-parse HEAD > SOURCE_SHA.txt
          {
            echo 'GridMates Grid Hunt - VISION LAB STABLE-SIGNED QA'
            echo 'Package: com.playereden.gridmates.gridhunt.qa'
            echo 'Package and version from built Android manifest:'
            "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging GridHunt-VisionLab-QA.apk | grep '^package:'
            echo 'Signer: PUBLIC, fixed test-only QA certificate (NOT a production signing key).'
            echo 'Future QA builds should install over this package when signed with the same key and a greater versionCode.'
            echo 'This is not a release-signed or phone-tested APK.'
            echo 'Uninstall older ephemeral-key QA10 and previous versions ONCE before this fixed-key QA build.'
            echo 'DO NOT install QA packages from unknown or untrusted sources.'
          } > INSTALL_NOTES.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs GridHunt-VisionLab-QA.apk > SIGNER.txt
          cat SIGNER.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 0ff2e763e5667bdfda45aab662639ea6c1c7efa813f82cd4a5cdba8225febd52' SIGNER.txt
          # Do not publish an APK signed with the wrong identity.
          echo 'Expected stable public QA certificate fingerprint verified.'
      - name: Fail closed unless update matches QA22's fixed identity
        run: |
          python3 scripts/qa_update_preflight.py \
            --baseline distribution/qa-update-baseline.json \
            --candidate vision-qa-output/GridHunt-VisionLab-QA.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --expected-version-code "$((10000 + GITHUB_RUN_NUMBER))" \
            --source-sha "$GITHUB_SHA" \
            --output vision-qa-output/UPDATE_PREFLIGHT.json
      - name: Upload QA APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: gridhunt-visionlab-${{ github.run_number }}
          path: vision-qa-output/
          if-no-files-found: error
          retention-days: 14

  android-instrumented-ui:
    name: Execute Compose navigation tests on Android emulator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow KVM acceleration on hosted Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real Android UI instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain
            # Pull genuine on-emulator screenshots created by VisualCaptureTest.
            mkdir -p vision-screenshots
            adb pull /sdcard/Android/data/com.playereden.gridmates.gridhunt.qa/files/visual-qa/. vision-screenshots/
            for file in 01_home.png 02_trail_treasures.png 03_trail_other_map_style.png 04_golden_spots.png 05_treasure_finish.png 06_golden_finish.png; do
              test -s "vision-screenshots/$file" || { echo "Missing visual QA screenshot: $file"; exit 1; }
            done
      - name: Publish Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridhunt-android-ui-test-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            vision-screenshots/
          if-no-files-found: warn
          retention-days: 14
