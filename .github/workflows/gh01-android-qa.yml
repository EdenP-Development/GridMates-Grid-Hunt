name: Grid Hunt Vision Lab QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/gh01-android-qa.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'scripts/**'
      - 'distribution/qa-update-baseline.json'
      - '.github/workflows/gh01-android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridhunt-stable-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    name: JVM tests, instrumentation-test compile and stable QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu already carries Android SDK; avoid setup-android@v3
      # attempting to install the retired 'tools' package on 2026 runners.
      - name: Verify or install required Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Test update-policy parsing and rejection cases
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Compile, execute core tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --stacktrace --console=plain
      - name: Assemble unsigned beta and verify separate package
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleBeta --no-daemon --max-workers=2 --console=plain
          apk=app/build/outputs/apk/beta/app-beta-unsigned.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          badging=$("$tools/aapt" dump badging "$apk")
          line=$(printf '%s\n' "$badging" | sed -n '1p')
          [[ "$line" == *"name='com.playereden.gridmates.gridhunt.beta'"* ]]
          [[ "$line" == *"versionCode='$((10000 + GITHUB_RUN_NUMBER))'"* ]]
          [[ "$line" == *"versionName='0.3.0-gh02c-beta.$GITHUB_RUN_NUMBER'"* ]]
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Unexpected signed staging APK'; exit 1
          fi
          echo 'PASS: isolated unsigned beta APK verified; no private secrets used.'
      - name: Verify exact startup artwork in APKs
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          assets = json.loads(pathlib.Path('branding/startup-v1.json').read_text())['assets']
          # Android may losslessly crunch PNG resource bytes. Verify exact
          # generated sources and presence in both packages independently.
          for asset in assets:
              path = pathlib.Path('app/build/generated/startupBranding/res/drawable-nodpi') / asset['file']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == asset['sha256'], path
          for apk in ['app/build/outputs/apk/debug/app-debug.apk','app/build/outputs/apk/beta/app-beta-unsigned.apk']:
              with zipfile.ZipFile(apk) as z:
                  for asset in assets:
                      assert any(n.startswith('res/') and n.endswith('/'+asset['file']) for n in z.namelist()), (apk, asset['file'])
          print('PASS: exact source hashes and packaged startup resources')
          PY
      - name: Capture exact source, signer and APK checksum
        run: |
          mkdir -p vision-qa-output
          cp app/build/outputs/apk/debug/app-debug.apk vision-qa-output/GridHunt-VisionLab-QA.apk
          cd vision-qa-output
          sha256sum GridHunt-VisionLab-QA.apk > APK_SHA256.txt
          git -C .. rev-parse HEAD > SOURCE_SHA.txt
          {
            echo 'GridMates Grid Hunt - VISION LAB STABLE-SIGNED QA'
            echo 'Package: com.playereden.gridmates.gridhunt.qa'
            echo 'Package and version from built Android manifest:'
            "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging GridHunt-VisionLab-QA.apk | grep '^package:'
            echo 'Signer: PUBLIC, fixed test-only QA certificate (NOT a production signing key).'
            echo 'Future QA builds should install over this package when signed with the same key and a greater versionCode.'
            echo 'This is not a release-signed or phone-tested APK.'
            echo 'Older ephemeral-key QA10 and earlier may be incompatible. Preserve existing installs; do NOT uninstall or clear data to bypass a signature mismatch.'
            echo 'DO NOT install QA packages from unknown or untrusted sources.'
          } > INSTALL_NOTES.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs GridHunt-VisionLab-QA.apk > SIGNER.txt
          cat SIGNER.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 0ff2e763e5667bdfda45aab662639ea6c1c7efa813f82cd4a5cdba8225febd52' SIGNER.txt
          # Do not publish an APK signed with the wrong identity.
          echo 'Expected stable public QA certificate fingerprint verified.'
      - name: Fail closed unless update matches QA22's fixed identity
        run: |
          python3 scripts/qa_update_preflight.py \
            --baseline distribution/qa-update-baseline.json \
            --candidate vision-qa-output/GridHunt-VisionLab-QA.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --expected-version-code "$((10000 + GITHUB_RUN_NUMBER))" \
            --source-sha "$GITHUB_SHA" \
            --output vision-qa-output/UPDATE_PREFLIGHT.json
      - name: Upload QA APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: gridhunt-visionlab-${{ github.run_number }}
          path: vision-qa-output/
          if-no-files-found: error
          retention-days: 14

  android-instrumented-ui:
    name: Execute Compose navigation tests on Android emulator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow KVM acceleration on hosted Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real Android UI instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain
            # Pull genuine on-emulator screenshots created by VisualCaptureTest.
            mkdir -p vision-screenshots
            # MediaStore captures persist through Gradle's test-APK teardown.
            adb pull /sdcard/Pictures/GridHuntVisualQA/. vision-screenshots/
            # The runner executes each script line separately: use standalone commands.
            test -s vision-screenshots/01_home.png
            test -s vision-screenshots/02_trail_treasures.png
            test -s vision-screenshots/03_trail_unobstructed_map.png
            test -s vision-screenshots/04_golden_spots.png
            test -s vision-screenshots/05_treasure_finish.png
            test -s vision-screenshots/06_golden_finish.png
            test -s vision-screenshots/07_trail_landscape.png
            test -s vision-screenshots/08_golden_landscape.png
            test -s vision-screenshots/09_woodland_checklist.png
            test -s vision-screenshots/10_woodland_checklist_finish.png
            test -s vision-screenshots/11_woodland_map_guide.png
            test -s vision-screenshots/12_identify_woodland.png
            test -s vision-screenshots/13_identify_finish.png
            test -s vision-screenshots/14_mixed_expedition.png
            test -s vision-screenshots/15_mixed_expedition_finish.png
            test -s vision-screenshots/16_explorer_desk_home.png
            test -s vision-screenshots/17_adventure_journey.png
            test -s vision-screenshots/18_custom_play_setup.png
            test -s vision-screenshots/19_compact_quick_play.png
            test -s vision-screenshots/20_chapter_two_locked.png
            test -s vision-screenshots/21_chapter_two_unlocked.png
            test -s vision-screenshots/22_lost_supplies_opening.png
      - name: Publish Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridhunt-android-ui-test-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            vision-screenshots/
          if-no-files-found: warn
          retention-days: 14
