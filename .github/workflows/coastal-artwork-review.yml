name: Coastal artwork review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artwork/worlds/whispering-coast/**'
      - 'scripts/verify_coastal_artwork.py'
      - '.github/workflows/coastal-artwork-review.yml'
  push:
    paths:
      - 'artwork/worlds/whispering-coast/**'
      - 'scripts/verify_coastal_artwork.py'
      - '.github/workflows/coastal-artwork-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
          python -m pip install CairoSVG==2.7.1 Pillow==11.3.0
      - run: python scripts/verify_coastal_artwork.py --output build/coastal-artwork-review
      - uses: actions/upload-artifact@v4
        with:
          name: coastal-artwork-review
          path: build/coastal-artwork-review/
          if-no-files-found: error
