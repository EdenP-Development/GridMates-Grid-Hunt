name: Grid Hunt beta APK signing proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gridhunt-beta-apk-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b4dc28766a3499844fc26a09b09eb775b9e64b7
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build pinned source without private credentials
        env:
          GITHUB_RUN_NUMBER: '302'
        run: |
          set -euo pipefail
          chmod +x gradlew
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew :core:test :app:assembleBeta --no-daemon --max-workers=2 --console=plain
          mkdir -p unsigned
          cp app/build/outputs/apk/beta/app-beta-unsigned.apk unsigned/beta.apk
          sha256sum unsigned/beta.apk > unsigned/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-gridhunt-proof
          path: unsigned/
          retention-days: 1
          if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-gridhunt-proof
          path: unsigned
      - name: Prepare Android verification utilities
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Sign and independently verify APK without publishing it
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIDMATES_GRID_HUNT_BETA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRIDMATES_GRID_HUNT_BETA_KEYSTORE_PASSWORD }}
          EXPECTED_CERT: 004f83350ed36c019987db2168090b318857d0e00f921bebf6076c4830ccafe6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d=$(mktemp -d "$RUNNER_TEMP/gridhunt-sign.XXXXXXXX")
          trap 'rm -rf "$d"' EXIT
          sha256sum -c unsigned/SHA256.txt
          tools="$ANDROID_HOME/build-tools/35.0.0"
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]]
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$d/key.p12"
          actual=$(keytool -exportcert -storetype PKCS12 -keystore "$d/key.p12" -storepass:env KEYSTORE_PASSWORD -alias gridhunt-beta | sha256sum | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_CERT" ]]
          "$tools/zipalign" -P 16 -f 4 unsigned/beta.apk "$d/aligned.apk"
          "$tools/apksigner" sign --ks "$d/key.p12" --ks-type PKCS12 --ks-key-alias gridhunt-beta --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$d/signed.apk" "$d/aligned.apk"
          "$tools/apksigner" verify --print-certs "$d/signed.apk" > "$d/signer.txt"
          signer=$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' "$d/signer.txt")
          [[ "$signer" == "$EXPECTED_CERT" ]]
          badging=$("$tools/aapt" dump badging "$d/signed.apk")
          line=$(printf '%s\n' "$badging" | sed -n '1p')
          [[ "$line" == *"name='com.playereden.gridmates.gridhunt.beta'"* ]]
          [[ "$line" == *"versionCode='10302'"* ]]
          [[ "$line" == *"versionName='0.3.0-gh02c-beta.302'"* ]]
          "$tools/zipalign" -c -P 16 4 "$d/signed.apk"
          hash=$(sha256sum "$d/signed.apk" | awk '{print $1}')
          echo "PASS: signed beta APK package, version and certificate verified; sha256=$hash"
          printf 'Signed APK proof only (not published).\nSource: 2b4dc28766a3499844fc26a09b09eb775b9e64b7\nPackage: com.playereden.gridmates.gridhunt.beta\nVersion: 10302 / 0.3.0-gh02c-beta.302\nCertificate: %s\nAPK SHA256: %s\n' "$signer" "$hash" >> "$GITHUB_STEP_SUMMARY"
