name: Grid Hunt private beta signer verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gridhunt-beta-signing-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify certificate and actual private-key signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIDMATES_GRID_HUNT_BETA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRIDMATES_GRID_HUNT_BETA_KEYSTORE_PASSWORD }}
          EXPECTED_CERT: 004f83350ed36c019987db2168090b318857d0e00f921bebf6076c4830ccafe6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]] || { echo 'Signing secrets unavailable'; exit 1; }
          d=$(mktemp -d "$RUNNER_TEMP/gridhunt-beta.XXXXXXXX")
          trap 'rm -rf "$d"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$d/key.p12"
          actual=$(keytool -exportcert -storetype PKCS12 -keystore "$d/key.p12" -storepass:env KEYSTORE_PASSWORD -alias gridhunt-beta | sha256sum | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_CERT" ]] || { echo 'Certificate mismatch'; exit 1; }
          # Prove private-key functionality without checking out or executing app code.
          printf 'Grid Hunt beta signing proof %s\n' "$GITHUB_RUN_ID" > "$d/proof.txt"
          jar --create --file "$d/proof.jar" -C "$d" proof.txt
          jarsigner -keystore "$d/key.p12" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD "$d/proof.jar" gridhunt-beta
          jarsigner -verify "$d/proof.jar" > "$d/verify.txt"
          grep -Fq 'jar verified.' "$d/verify.txt"
          echo "PASS: pinned certificate $actual and private-key signing verified."
          echo 'Private beta signing proof passed; no APK published or uploaded.' >> "$GITHUB_STEP_SUMMARY"
